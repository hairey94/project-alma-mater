<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <!-- TILE 1 (0,0): ROAD CENTER (Pure Textured Asphalt) -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="16" height="16" fill="#323437"/>
    <!-- Asphalt Grain Speckles -->
    <rect x="2" y="3" width="1" height="1" fill="#28292A"/>
    <rect x="9" y="1" width="1" height="1" fill="#3E4044"/>
    <rect x="13" y="11" width="1" height="1" fill="#28292A"/>
    <rect x="5" y="8" width="1" height="1" fill="#3E4044"/>
    <rect x="11" y="5" width="1" height="1" fill="#28292A"/>
  </g>

  <!-- TILE 2 (1,0): ROAD EDGE / CURB - TOP LAYER -->
  <g transform="translate(16,0)">
    <!-- Base Asphalt -->
    <rect x="0" y="0" width="16" height="16" fill="#323437"/>
    <!-- Concrete Curb Trim (Top 3 pixels) -->
    <rect x="0" y="0" width="16" height="2" fill="#7A7E85"/>
    <rect x="0" y="2" width="16" height="1" fill="#52555A"/>
    <!-- Curb expansion joints -->
    <rect x="0" y="0" width="1" height="3" fill="#404245"/>
    <rect x="8" y="0" width="1" height="3" fill="#404245"/>
  </g>

  <!-- TILE 3 (2,0): ROAD EDGE / CURB - LEFT LAYER -->
  <g transform="translate(32,0)">
    <rect x="0" y="0" width="16" height="16" fill="#323437"/>
    <!-- Concrete Curb Trim (Left 3 pixels) -->
    <rect x="0" y="0" width="2" height="16" fill="#7A7E85"/>
    <rect x="2" y="0" width="1" height="16" fill="#52555A"/>
    <!-- Curb expansion joints -->
    <rect x="0" y="0" width="3" height="1" fill="#404245"/>
    <rect x="0" y="8" width="3" height="1" fill="#404245"/>
  </g>

  <!-- TILE 4 (3,0): ROAD CORNER CURB - TOP LEFT OUTER -->
  <g transform="translate(48,0)">
    <rect x="0" y="0" width="16" height="16" fill="#323437"/>
    <!-- Merging Left and Top Curbs -->
    <rect x="0" y="0" width="16" height="2" fill="#7A7E85"/>
    <rect x="0" y="0" width="2" height="16" fill="#7A7E85"/>
    <rect x="2" y="2" width="14" height="1" fill="#52555A"/>
    <rect x="2" y="2" width="1" height="14" fill="#52555A"/>
    <rect x="0" y="0" width="3" height="3" fill="#91969E"/>
  </g>
</svg>
